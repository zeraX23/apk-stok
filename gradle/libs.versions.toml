[versions]
agp = "8.5.0"
kotlin = "2.1.21"
googleDevtoolsKsp = "2.1.21-1.0.31"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.3"
activityCompose = "1.9.0"
composeBom = "2024.06.00"
